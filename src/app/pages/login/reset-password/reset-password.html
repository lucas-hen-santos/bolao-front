<div class="min-h-screen bg-pattern-dark flex flex-col items-center justify-center p-4 relative overflow-hidden">
  
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.03)_1px,_transparent_1px)] bg-[size:32px_32px] pointer-events-none opacity-60 z-0"></div>
  
  <div class="absolute top-1/4 -left-20 w-96 h-96 bg-racing-red/10 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>
  <div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-racing-red/5 rounded-full blur-[120px] pointer-events-none animate-pulse-slow" style="animation-delay: 2s;"></div>

  <div class="max-w-md w-full relative z-10 animate-slide-up">
    
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-black/60 border border-gray-800 shadow-2xl mb-6 group hover:border-racing-red/50 transition-colors duration-500">
        <span class="text-4xl group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_0_15px_rgba(239,68,68,0.4)]">🔐</span>
      </div>
      <h1 class="text-4xl font-black text-white italic uppercase tracking-tighter leading-none drop-shadow-lg">
        Nova <span class="text-racing-red">Senha</span>
      </h1>
      <p class="text-gray-500 text-[10px] font-black uppercase tracking-[0.3em] mt-2">Security Override System</p>
    </div>

    <div class="glass-panel glass-shimmer f1-clip p-8 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.8)] border-t border-t-white/10">
      
      <p class="text-gray-400 text-[10px] font-black uppercase tracking-[0.2em] mb-8 text-center leading-relaxed">
        Defina suas novas credenciais de acesso ao cockpit.
      </p>

      <form (ngSubmit)="onSubmit()" class="space-y-6 relative z-10">
        
        <div>
          <label class="block text-gray-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2 ml-1">Nova Senha</label>
          <div class="relative group">
            <input type="password" [(ngModel)]="newPassword" name="newPassword" required
                   class="w-full bg-black/60 text-white p-4 pl-12 rounded-xl border border-gray-700 focus:border-racing-red outline-none font-bold text-sm transition-all shadow-inner placeholder-gray-800"
                   placeholder="••••••••">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-racing-red transition-colors text-lg">🔒</span>
          </div>
        </div>

        <div>
          <label class="block text-gray-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2 ml-1">Confirmar Nova Senha</label>
          <div class="relative group">
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                   class="w-full bg-black/60 text-white p-4 pl-12 rounded-xl border border-gray-700 focus:border-racing-red outline-none font-bold text-sm transition-all shadow-inner placeholder-gray-800"
                   placeholder="••••••••">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-600 group-focus-within:text-racing-red transition-colors text-lg">🛡️</span>
          </div>
        </div>

        @if (newPassword && confirmPassword && newPassword !== confirmPassword) {
          <p class="text-red-500 text-[9px] font-black uppercase tracking-widest animate-pulse ml-1">
            ⚠️ As senhas não coincidem
          </p>
        }

        <button type="submit" [disabled]="isLoading || !newPassword || !confirmPassword"
                class="w-full group/btn relative overflow-hidden bg-white text-black font-black py-5 rounded-xl shadow-[0_0_30px_rgba(255,255,255,0.1)] hover:shadow-[0_0_40px_rgba(255,255,255,0.3)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3 uppercase tracking-[0.2em] text-xs f1-clip-button">
          
          <div class="absolute inset-0 w-[200%] h-full bg-gradient-to-r from-transparent via-gray-200 to-transparent -translate-x-full group-hover/btn:animate-[shimmer-sweep_1.5s_infinite_linear]"></div>
          
          @if (isLoading) {
            <div class="w-5 h-5 border-2 border-black/20 border-t-black rounded-full animate-spin"></div>
            <span class="relative z-10">Atualizando...</span>
          } @else {
            <span class="relative z-10">Confirmar Nova Senha</span>
            <span class="text-xl relative z-10 group-hover:translate-x-1 transition-transform">➔</span>
          }
        </button>
      </form>

      <div class="mt-8 pt-8 border-t border-gray-800">
        <a routerLink="/login"
           class="w-full py-4 rounded-xl border border-gray-800 text-gray-500 font-black text-[10px] uppercase tracking-[0.2em] hover:bg-white/5 hover:text-white hover:border-white/20 transition-all flex items-center justify-center gap-2">
          <span>🔙</span> Cancelar e Voltar
        </a>
      </div>

    </div>

    <div class="mt-10 text-center">
      <p class="text-[9px] text-gray-600 font-bold uppercase tracking-widest">
        Official Racing League Security • Bolão Tá Potente
      </p>
    </div>

  </div>
</div>
