<div class="min-h-screen bg-pattern-dark flex flex-col items-center justify-center p-4 relative overflow-hidden">
  
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.03)_1px,_transparent_1px)] bg-[size:32px_32px] pointer-events-none opacity-40 z-0"></div>
  
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-yellow-500/5 rounded-full blur-[120px] pointer-events-none animate-pulse-slow"></div>

  <div class="max-w-2xl w-full text-center relative z-10 animate-slide-up">
    
    <div class="relative inline-block mb-8">
      <div class="text-[120px] md:text-[180px] font-black text-white/5 italic leading-none select-none tracking-tighter">
        404
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-6xl md:text-8xl drop-shadow-[0_0_30px_rgba(239,68,68,0.5)] animate-bounce-slow">🚧</span>
      </div>
    </div>

    <h1 class="text-3xl md:text-5xl font-black text-white italic uppercase tracking-tighter mb-4">
      Você saiu da <span class="text-racing-red">Pista!</span>
    </h1>
    
    <div class="glass-panel p-6 md:p-8 mb-10 border-t border-t-yellow-500/30 f1-clip">
      <p class="text-gray-400 font-bold text-sm md:text-base leading-relaxed uppercase tracking-wide">
        Direção de prova informa: O setor que você tenta acessar não existe ou foi desativado. 
        <br><span class="text-yellow-500/80 text-xs">Bandeira Amarela em todo o circuito.</span>
      </p>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <a routerLink="/dashboard" 
         class="w-full sm:w-auto bg-white text-black font-black py-4 px-10 rounded-xl shadow-[0_0_30px_rgba(255,255,255,0.2)] hover:shadow-[0_0_50px_rgba(255,255,255,0.4)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-3 uppercase tracking-[0.2em] text-xs f1-clip-button group">
        <span class="text-xl group-hover:-translate-x-1 transition-transform">🔙</span>
        Voltar para a Corrida
      </a>
    </div>

    <div class="mt-16 flex items-center justify-center gap-8 opacity-30">
      <div class="text-left">
        <span class="block text-[8px] font-black text-gray-500 uppercase tracking-widest">Error Code</span>
        <span class="text-xs font-mono text-white">0x404_NOT_FOUND</span>
      </div>
      <div class="h-8 w-[1px] bg-gray-700"></div>
      <div class="text-left">
        <span class="block text-[8px] font-black text-gray-500 uppercase tracking-widest">Status</span>
        <span class="text-xs font-mono text-white">OFF_TRACK</span>
      </div>
    </div>

  </div>
</div>
